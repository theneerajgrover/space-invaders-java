<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="auto" style="background:#0a0a1a; border-radius:12px; overflow:hidden;">
  <defs>
    <radialGradient id="flowBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141432"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>

    <linearGradient id="cardDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181836"/>
      <stop offset="100%" stop-color="#0e0e22"/>
    </linearGradient>

    <filter id="fGlowCyan" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="fArrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#00e5ff"/>
    </marker>
    <marker id="fArrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#39ff14"/>
    </marker>
    <marker id="fArrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#ff4444"/>
    </marker>
    <marker id="fArrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#b388ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="460" fill="url(#flowBg)"/>
  <rect x="2" y="2" width="896" height="456" rx="10" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Header Title -->
  <g transform="translate(450, 36)" text-anchor="middle">
    <text font-family="'Segoe UI', Consolas, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="4">GAMEPLAY LIFECYCLE &amp; STATE FLOW</text>
    <text y="20" font-family="'Segoe UI', Consolas, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="2">FROM PILOT REGISTRATION TO IN-BROWSER 60 FPS LOOP AND SQLITE PERSISTENCE</text>
  </g>

  <!-- ================= STAGE 1: MENU SCREEN ================= -->
  <g transform="translate(40, 80)">
    <rect width="180" height="120" rx="8" fill="url(#cardDarkGrad)" stroke="#00e5ff" stroke-width="1.2" filter="url(#fGlowCyan)"/>
    <rect x="0" y="0" width="180" height="26" rx="8" fill="#00e5ff" fill-opacity="0.15"/>
    <text x="90" y="18" text-anchor="middle" font-family="'Segoe UI', Consolas, monospace" font-size="11" font-weight="800" fill="#00e5ff" letter-spacing="1">1. MAIN MENU</text>
    <text x="12" y="46" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#ffffff">• Pilot Name Input</text>
    <text x="12" y="62" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#8892a0">  (Validates 1-20 chars)</text>
    <text x="12" y="80" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#ffffff">• START GAME button</text>
    <text x="12" y="98" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#8892a0">• INSTRUCTIONS button</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M220 140 L260 140" stroke="#00e5ff" stroke-width="2" marker-end="url(#fArrowCyan)"/>

  <!-- ================= STAGE 2: INITIALIZATION ================= -->
  <g transform="translate(265, 80)">
    <rect width="190" height="120" rx="8" fill="url(#cardDarkGrad)" stroke="#39ff14" stroke-width="1.2"/>
    <rect x="0" y="0" width="190" height="26" rx="8" fill="#39ff14" fill-opacity="0.15"/>
    <text x="95" y="18" text-anchor="middle" font-family="'Segoe UI', Consolas, monospace" font-size="11" font-weight="800" fill="#39ff14" letter-spacing="1">2. INIT STATE</text>
    <text x="12" y="46" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#ffffff">• Canvas 800×600</text>
    <text x="12" y="62" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#ffffff">• 120 Starfield Particles</text>
    <text x="12" y="78" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#ffffff">• 32 Aliens (4 rows × 8 cols)</text>
    <text x="12" y="94" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#ffffff">• Player (Cyan Vector Cannon)</text>
    <text x="12" y="110" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#39ff14">• Lives: 3 | Score: 0</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M455 140 L495 140" stroke="#39ff14" stroke-width="2" marker-end="url(#fArrowGreen)"/>

  <!-- ================= STAGE 3: ACTIVE 60 FPS GAME LOOP ================= -->
  <g transform="translate(500, 80)">
    <rect width="360" height="175" rx="8" fill="url(#cardDarkGrad)" stroke="#00e5ff" stroke-width="1.5" filter="url(#fGlowCyan)"/>
    <rect x="0" y="0" width="360" height="28" rx="8" fill="#00e5ff" fill-opacity="0.18"/>
    <text x="180" y="19" text-anchor="middle" font-family="'Segoe UI', Consolas, monospace" font-size="11.5" font-weight="800" fill="#00e5ff" letter-spacing="2">3. REAL-TIME 60 FPS ENGINE (CANVAS)</text>
    
    <!-- Sub-boxes -->
    <g transform="translate(12, 38)">
      <rect width="160" height="122" rx="4" fill="#0a0a1a" stroke="#8892a0" stroke-width="0.5"/>
      <text x="8" y="18" font-family="'Segoe UI', Consolas, sans-serif" font-size="10" font-weight="700" fill="#00e5ff">INPUT &amp; CONTROLS</text>
      <text x="8" y="36" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#ffffff">• ← / → or A / D (Move)</text>
      <text x="8" y="52" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#ffffff">• Space (Fire, 250ms cd)</text>
      <text x="8" y="68" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#ffffff">• P key (Pause/Resume)</text>
      <text x="8" y="84" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#ffffff">• R key (In-game Restart)</text>
      <text x="8" y="104" font-family="'Segoe UI', Consolas, sans-serif" font-size="8" fill="#8892a0">Strict canvas clamping</text>
    </g>

    <g transform="translate(185, 38)">
      <rect width="162" height="122" rx="4" fill="#0a0a1a" stroke="#8892a0" stroke-width="0.5"/>
      <text x="8" y="18" font-family="'Segoe UI', Consolas, sans-serif" font-size="10" font-weight="700" fill="#39ff14">UPDATE &amp; COLLISIONS</text>
      <text x="8" y="36" font-family="'Segoe UI', Consolas, sans-serif" font-size="8.8" fill="#ffffff">• 32-Alien Formation March</text>
      <text x="8" y="50" font-family="'Segoe UI', Consolas, sans-serif" font-size="8.5" fill="#8892a0">  (Drops 22px on edge)</text>
      <text x="8" y="64" font-family="'Segoe UI', Consolas, sans-serif" font-size="8.8" fill="#ffffff">• Alien Laser Fire (0.002)</text>
      <text x="8" y="78" font-family="'Segoe UI', Consolas, sans-serif" font-size="8.8" fill="#ffffff">• AABB Rect Collisions:</text>
      <text x="12" y="92" font-family="'Segoe UI', Consolas, sans-serif" font-size="8.5" fill="#39ff14">  Hit alien → +100 pts</text>
      <text x="12" y="106" font-family="'Segoe UI', Consolas, sans-serif" font-size="8.5" fill="#ff4444">  Hit player → Lives -1</text>
    </g>
  </g>

  <!-- Branch arrows downward from Loop -->
  <!-- Left branch -> Defeat / Game Over -->
  <path d="M590 255 L590 300 L320 300 L320 320" stroke="#ff4444" stroke-width="2" marker-end="url(#fArrowRed)"/>
  <rect x="360" y="288" width="190" height="20" rx="4" fill="#0a0a1a" stroke="#ff4444" stroke-width="0.8"/>
  <text x="455" y="302" text-anchor="middle" font-family="'Segoe UI', Consolas, sans-serif" font-size="8.5" font-weight="700" fill="#ff4444">Lives = 0 OR Invader Lands</text>

  <!-- Right branch -> Victory -->
  <path d="M770 255 L770 320" stroke="#39ff14" stroke-width="2" marker-end="url(#fArrowGreen)"/>
  <rect x="705" y="278" width="130" height="20" rx="4" fill="#0a0a1a" stroke="#39ff14" stroke-width="0.8"/>
  <text x="770" y="292" text-anchor="middle" font-family="'Segoe UI', Consolas, sans-serif" font-size="8.5" font-weight="700" fill="#39ff14">All 32 Aliens Cleared</text>

  <!-- ================= STAGE 4A: GAME OVER ================= -->
  <g transform="translate(190, 325)">
    <rect width="260" height="110" rx="8" fill="url(#cardDarkGrad)" stroke="#ff4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="260" height="24" rx="8" fill="#ff4444" fill-opacity="0.15"/>
    <text x="130" y="17" text-anchor="middle" font-family="'Segoe UI', Consolas, monospace" font-size="10.5" font-weight="800" fill="#ff4444" letter-spacing="1">4A. GAME OVER SCREEN</text>
    <text x="12" y="42" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#ffffff">• Displays Final Score &amp; Enemies Killed</text>
    <text x="12" y="58" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#ff4444">• NO SAVE SCORE button on defeat</text>
    <text x="12" y="76" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#00e5ff">• PLAY AGAIN → Re-initializes state</text>
    <text x="12" y="94" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#8892a0">• MAIN MENU → Returns to title screen</text>
  </g>

  <!-- ================= STAGE 4B: VICTORY & PERSISTENCE ================= -->
  <g transform="translate(560, 325)">
    <rect width="300" height="110" rx="8" fill="url(#cardDarkGrad)" stroke="#39ff14" stroke-width="1.2"/>
    <rect x="0" y="0" width="300" height="24" rx="8" fill="#39ff14" fill-opacity="0.15"/>
    <text x="150" y="17" text-anchor="middle" font-family="'Segoe UI', Consolas, monospace" font-size="10.5" font-weight="800" fill="#39ff14" letter-spacing="1">4B. VICTORY &amp; PERSISTENCE</text>
    <text x="12" y="42" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#ffffff">• Displays Final Score &amp; Enemies Killed</text>
    <text x="12" y="60" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" font-weight="700" fill="#39ff14">• SAVE SCORE BUTTON ACTIVE</text>
    <text x="12" y="76" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#00e5ff">  POST /api/scores → Saved to SQLite</text>
    <text x="12" y="94" font-family="'Segoe UI', Consolas, sans-serif" font-size="9.5" fill="#8892a0">• PLAY AGAIN / MAIN MENU Navigation</text>
  </g>

  <!-- Loop back arrow from Restart to Stage 2 -->
  <path d="M190 380 L120 380 L120 200" stroke="#8892a0" stroke-dasharray="4,4" stroke-width="1.2" marker-end="url(#fArrowPurple)"/>
  <text x="100" y="300" font-family="'Segoe UI', Consolas, sans-serif" font-size="8" fill="#8892a0" transform="rotate(-90 100 300)">RESTART / PLAY AGAIN</text>
</svg>
