<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="auto" style="background:#0a0a1a; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141432" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0c0c20" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="cyanCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0099b8"/>
    </linearGradient>

    <linearGradient id="hudBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Styles for Infinite CSS Keyframe Animations -->
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes titlePulse {
        0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.6)) drop-shadow(0 0 25px rgba(0, 229, 255, 0.3)); }
        50% { filter: drop-shadow(0 0 22px rgba(0, 229, 255, 0.9)) drop-shadow(0 0 45px rgba(0, 229, 255, 0.5)); }
      }
      @keyframes shipHover {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes laserShoot {
        0% { transform: translateY(0); opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translateY(-190px); opacity: 0; }
      }
      @keyframes engineFlicker {
        0%, 100% { opacity: 0.85; transform: scaleY(1); }
        50% { opacity: 1; transform: scaleY(1.35); }
      }
      @keyframes invaderShuffle {
        0%, 49.9% { opacity: 1; display: inline; }
        50%, 100% { opacity: 0; display: none; }
      }
      @keyframes invaderShuffleAlt {
        0%, 49.9% { opacity: 0; display: none; }
        50%, 100% { opacity: 1; display: inline; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(380px); }
      }

      .star-s1 { animation: twinkle 3s ease-in-out infinite; transform-origin: center; }
      .star-s2 { animation: twinkle 4.2s ease-in-out infinite 1.2s; transform-origin: center; }
      .star-s3 { animation: twinkle 2.5s ease-in-out infinite 0.7s; transform-origin: center; }
      .star-s4 { animation: twinkle 5s ease-in-out infinite 2.1s; transform-origin: center; }

      .hero-title {
        font-family: 'Segoe UI', 'Impact', 'Arial Black', sans-serif;
        font-weight: 900;
        animation: titlePulse 3.5s ease-in-out infinite;
      }
      .ship-group {
        animation: shipHover 2.8s ease-in-out infinite;
      }
      .laser-bolt {
        animation: laserShoot 1.4s cubic-bezier(0.2, 0.7, 0.4, 1) infinite;
      }
      .thruster {
        animation: engineFlicker 0.22s ease-in-out infinite;
        transform-origin: 820px 290px;
      }
      .invader-frame-1 {
        animation: invaderShuffle 1.2s infinite;
      }
      .invader-frame-2 {
        animation: invaderShuffleAlt 1.2s infinite;
      }
      .scanline-bar {
        animation: scanline 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="380" fill="url(#spaceGlow)"/>

  <!-- Subtle Perspective Grid Horizon at Bottom -->
  <g opacity="0.18">
    <line x1="0" y1="330" x2="1000" y2="330" stroke="#00e5ff" stroke-width="1.5"/>
    <line x1="0" y1="350" x2="1000" y2="350" stroke="#00e5ff" stroke-width="1"/>
    <line x1="0" y1="365" x2="1000" y2="365" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="0" y1="375" x2="1000" y2="375" stroke="#00e5ff" stroke-width="0.5"/>
    <line x1="500" y1="310" x2="100" y2="380" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="500" y1="310" x2="250" y2="380" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="500" y1="310" x2="400" y2="380" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="500" y1="310" x2="600" y2="380" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="500" y1="310" x2="750" y2="380" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="500" y1="310" x2="900" y2="380" stroke="#00e5ff" stroke-width="0.8"/>
  </g>

  <!-- Ambient Central Core Glow -->
  <circle cx="500" cy="180" r="280" fill="url(#cyanCoreGlow)"/>

  <!-- Starfield Layer (Twinkling) -->
  <g fill="#ffffff">
    <!-- Star Group 1 -->
    <circle cx="45" cy="55" r="1.5" class="star-s1"/>
    <circle cx="110" cy="140" r="1" class="star-s1"/>
    <circle cx="210" cy="40" r="2" class="star-s1"/>
    <circle cx="340" cy="90" r="1.2" class="star-s1"/>
    <circle cx="480" cy="45" r="1.5" class="star-s1"/>
    <circle cx="620" cy="80" r="1.8" class="star-s1"/>
    <circle cx="760" cy="40" r="1.3" class="star-s1"/>
    <circle cx="890" cy="70" r="2" class="star-s1"/>
    <circle cx="940" cy="130" r="1" class="star-s1"/>

    <!-- Star Group 2 -->
    <circle cx="80" cy="220" r="1.2" class="star-s2"/>
    <circle cx="160" cy="280" r="1.8" class="star-s2"/>
    <circle cx="270" cy="180" r="1" class="star-s2"/>
    <circle cx="390" cy="240" r="1.5" class="star-s2"/>
    <circle cx="530" cy="290" r="1.2" class="star-s2"/>
    <circle cx="670" cy="220" r="1.6" class="star-s2"/>
    <circle cx="730" cy="160" r="1" class="star-s2"/>
    <circle cx="850" cy="250" r="2" class="star-s2"/>
    <circle cx="960" cy="210" r="1.4" class="star-s2"/>

    <!-- Star Group 3 -->
    <circle cx="30" cy="310" r="1" class="star-s3"/>
    <circle cx="140" cy="80" r="1.5" class="star-s3"/>
    <circle cx="250" cy="300" r="1.3" class="star-s3"/>
    <circle cx="370" cy="30" r="1.7" class="star-s3"/>
    <circle cx="580" cy="50" r="1" class="star-s3"/>
    <circle cx="700" cy="300" r="1.4" class="star-s3"/>
    <circle cx="820" cy="110" r="1.8" class="star-s3"/>
    <circle cx="910" cy="320" r="1.2" class="star-s3"/>

    <!-- Star Group 4 -->
    <circle cx="60" cy="170" r="1.4" class="star-s4"/>
    <circle cx="180" cy="30" r="1" class="star-s4"/>
    <circle cx="310" cy="290" r="1.6" class="star-s4"/>
    <circle cx="440" cy="110" r="1.2" class="star-s4"/>
    <circle cx="640" cy="280" r="1.5" class="star-s4"/>
    <circle cx="790" cy="220" r="1" class="star-s4"/>
    <circle cx="880" cy="170" r="1.7" class="star-s4"/>
    <circle cx="970" cy="60" r="1.3" class="star-s4"/>
  </g>

  <!-- Top Arcade HUD Bar -->
  <g>
    <!-- Border line -->
    <line x1="50" y1="36" x2="950" y2="36" stroke="url(#hudBorderGrad)" stroke-width="1.2"/>

    <!-- Left HUD: Score -->
    <g transform="translate(60, 24)">
      <text font-family="'Segoe UI', Consolas, monospace" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="2">SCORE</text>
      <text x="65" font-family="'Segoe UI', Consolas, monospace" font-size="12" font-weight="900" fill="#39ff14" filter="url(#glowGreen)" letter-spacing="1">3200</text>
    </g>

    <!-- Center HUD: Mission Status -->
    <g transform="translate(435, 24)">
      <circle cx="0" cy="-3" r="3.5" fill="#39ff14" filter="url(#glowGreen)"/>
      <text x="12" font-family="'Segoe UI', Consolas, monospace" font-size="10" font-weight="700" fill="#8892a0" letter-spacing="3">SYSTEM ACTIVE • 60 FPS</text>
    </g>

    <!-- Right HUD: Lives -->
    <g transform="translate(860, 24)">
      <text font-family="'Segoe UI', Consolas, monospace" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="2">LIVES</text>
      <text x="50" font-family="'Segoe UI', Consolas, monospace" font-size="12" fill="#ff4444" letter-spacing="2">♥♥♥</text>
    </g>
  </g>

  <!-- Left Side: Alien Invaders Squad (Continuously Shuffling) -->
  <g transform="translate(65, 110)">
    <!-- Invader 1 (Violet - Row 1) Frame 1 -->
    <g class="invader-frame-1" fill="#b388ff" filter="url(#glowPurple)">
      <rect x="0" y="8" width="40" height="20" rx="3"/>
      <rect x="8" y="0" width="24" height="10" rx="2"/>
      <rect x="4" y="28" width="8" height="8" rx="2"/>
      <rect x="28" y="28" width="8" height="8" rx="2"/>
      <!-- Eyes -->
      <rect x="8" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="25" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="11" y="13" width="3" height="3" fill="#0a0a1a"/>
      <rect x="28" y="13" width="3" height="3" fill="#0a0a1a"/>
    </g>
    <!-- Invader 1 Frame 2 -->
    <g class="invader-frame-2" fill="#b388ff" filter="url(#glowPurple)">
      <rect x="0" y="8" width="40" height="20" rx="3"/>
      <rect x="8" y="0" width="24" height="10" rx="2"/>
      <rect x="0" y="28" width="8" height="8" rx="2"/>
      <rect x="32" y="28" width="8" height="8" rx="2"/>
      <!-- Eyes -->
      <rect x="8" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="25" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="9" y="13" width="3" height="3" fill="#0a0a1a"/>
      <rect x="26" y="13" width="3" height="3" fill="#0a0a1a"/>
    </g>

    <!-- Invader 2 (Coral - Row 2) Frame 1 -->
    <g transform="translate(60, 50)" class="invader-frame-1" fill="#ff6b6b">
      <rect x="0" y="8" width="40" height="20" rx="3"/>
      <rect x="8" y="0" width="24" height="10" rx="2"/>
      <rect x="4" y="28" width="8" height="8" rx="2"/>
      <rect x="28" y="28" width="8" height="8" rx="2"/>
      <!-- Eyes -->
      <rect x="8" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="25" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="11" y="13" width="3" height="3" fill="#0a0a1a"/>
      <rect x="28" y="13" width="3" height="3" fill="#0a0a1a"/>
    </g>
    <!-- Invader 2 Frame 2 -->
    <g transform="translate(60, 50)" class="invader-frame-2" fill="#ff6b6b">
      <rect x="0" y="8" width="40" height="20" rx="3"/>
      <rect x="8" y="0" width="24" height="10" rx="2"/>
      <rect x="0" y="28" width="8" height="8" rx="2"/>
      <rect x="32" y="28" width="8" height="8" rx="2"/>
      <!-- Eyes -->
      <rect x="8" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="25" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="9" y="13" width="3" height="3" fill="#0a0a1a"/>
      <rect x="26" y="13" width="3" height="3" fill="#0a0a1a"/>
    </g>

    <!-- Invader 3 (Violet) Frame 1 -->
    <g transform="translate(120, 0)" class="invader-frame-2" fill="#b388ff" filter="url(#glowPurple)">
      <rect x="0" y="8" width="40" height="20" rx="3"/>
      <rect x="8" y="0" width="24" height="10" rx="2"/>
      <rect x="0" y="28" width="8" height="8" rx="2"/>
      <rect x="32" y="28" width="8" height="8" rx="2"/>
      <!-- Eyes -->
      <rect x="8" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="25" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="9" y="13" width="3" height="3" fill="#0a0a1a"/>
      <rect x="26" y="13" width="3" height="3" fill="#0a0a1a"/>
    </g>
    <!-- Invader 3 Frame 2 -->
    <g transform="translate(120, 0)" class="invader-frame-1" fill="#b388ff" filter="url(#glowPurple)">
      <rect x="0" y="8" width="40" height="20" rx="3"/>
      <rect x="8" y="0" width="24" height="10" rx="2"/>
      <rect x="4" y="28" width="8" height="8" rx="2"/>
      <rect x="28" y="28" width="8" height="8" rx="2"/>
      <!-- Eyes -->
      <rect x="8" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="25" y="10" width="7" height="7" fill="#ffffff"/>
      <rect x="11" y="13" width="3" height="3" fill="#0a0a1a"/>
      <rect x="28" y="13" width="3" height="3" fill="#0a0a1a"/>
    </g>
  </g>

  <!-- Center: Focal Title Block -->
  <g transform="translate(500, 155)" text-anchor="middle">
    <!-- Main Title -->
    <text y="0" class="hero-title" font-size="52" fill="#ffffff" letter-spacing="8">SPACE</text>
    <text y="54" class="hero-title" font-size="52" fill="#00e5ff" letter-spacing="14">INVADERS</text>

    <!-- Tagline -->
    <text y="92" font-family="'Segoe UI', Consolas, sans-serif" font-size="12" font-weight="700" fill="#8892a0" letter-spacing="5">DEFEND THE GALAXY • SURVIVE THE INVASION</text>

    <!-- Divider Pill Accent -->
    <rect x="-140" y="108" width="280" height="2" fill="url(#hudBorderGrad)"/>
  </g>

  <!-- Right Side: Player Ship & Active Laser Cannon (Continuously Animated) -->
  <g transform="translate(800, 240)">
    <!-- Continuous Laser Bolt Loop -->
    <g class="laser-bolt">
      <rect x="18" y="-15" width="4" height="22" rx="2" fill="#39ff14" filter="url(#glowGreen)"/>
      <circle cx="20" cy="-15" r="3" fill="#ffffff"/>
    </g>

    <!-- Player Ship Body Group (Floating Hover) -->
    <g class="ship-group">
      <!-- Thruster Flame -->
      <polygon points="15,44 25,44 20,56" fill="#39ff14" filter="url(#glowGreen)" class="thruster"/>
      <polygon points="17,44 23,44 20,51" fill="#ffffff" class="thruster"/>

      <!-- Ship Hull (Cyan Triangle) -->
      <polygon points="20,0 0,44 40,44" fill="#00e5ff" filter="url(#glowCyan)"/>

      <!-- Inner Cockpit -->
      <polygon points="20,10 10,40 30,40" fill="#004d66"/>
      <polygon points="20,12 13,38 27,38" fill="#002b3a"/>

      <!-- Wing Accents -->
      <polygon points="20,4 2,42 7,42" fill="#ffffff" opacity="0.6"/>
      <rect x="14" y="40" width="12" height="4" fill="#39ff14"/>
    </g>
  </g>

  <!-- Bottom Technical Architecture Badges Bar -->
  <g transform="translate(500, 345)" text-anchor="middle">
    <!-- Outer boundary glow line -->
    <line x1="-380" y1="-18" x2="380" y2="-18" stroke="url(#hudBorderGrad)" stroke-width="1"/>

    <g font-family="'Segoe UI', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="2">
      <text x="-250" fill="#00e5ff">HTML5 CANVAS</text>
      <text x="-165" fill="#8892a0">•</text>
      <text x="-95" fill="#39ff14">JAVA 17</text>
      <text x="-25" fill="#8892a0">•</text>
      <text x="65" fill="#00e5ff">SPRING BOOT 3.2.5</text>
      <text x="165" fill="#8892a0">•</text>
      <text x="250" fill="#b388ff">SQLITE PERSISTENCE</text>
    </g>
  </g>

  <!-- Frame Border / Neon Trim -->
  <rect x="1" y="1" width="998" height="378" rx="11" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="4" y="4" width="992" height="372" rx="9" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>
