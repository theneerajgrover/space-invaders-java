<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="auto" style="background:#0a0a1a; border-radius:8px; overflow:hidden;">
  <defs>
    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#39ff14" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <style>
      @keyframes footerTwinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .fstar { animation: footerTwinkle 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="80" fill="#0a0a1a"/>
  <line x1="50" y1="12" x2="850" y2="12" stroke="url(#footerLineGrad)" stroke-width="1.2"/>

  <!-- Small stars -->
  <circle cx="120" cy="40" r="1.2" fill="#fff" class="fstar"/>
  <circle cx="280" cy="60" r="1.5" fill="#fff" class="fstar" style="animation-delay: 1.2s;"/>
  <circle cx="620" cy="50" r="1" fill="#fff" class="fstar" style="animation-delay: 0.6s;"/>
  <circle cx="780" cy="35" r="1.3" fill="#fff" class="fstar" style="animation-delay: 1.8s;"/>

  <!-- Centered Emblem -->
  <g transform="translate(450, 48)" text-anchor="middle">
    <text font-family="'Segoe UI', Consolas, monospace" font-size="11" font-weight="800" fill="#00e5ff" letter-spacing="4">EARTH DEFENSE COMMAND • RETRO ARCADE INITIATIVE</text>
    <text y="16" font-family="'Segoe UI', Consolas, sans-serif" font-size="9" fill="#8892a0" letter-spacing="2">BUILT WITH SPRING BOOT 3 • VANILLA JS CANVAS • SQLITE</text>
  </g>
</svg>
