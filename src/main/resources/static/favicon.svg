<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: deep navy space -->
  <rect width="64" height="64" rx="8" fill="#0a0a1a"/>
  <!-- Alien invader body - pixel art style using project accent colors -->
  <!-- Head/top row -->
  <rect x="24" y="8" width="4" height="4" fill="#00e5ff"/>
  <rect x="36" y="8" width="4" height="4" fill="#00e5ff"/>
  <!-- Second row -->
  <rect x="20" y="12" width="4" height="4" fill="#00e5ff"/>
  <rect x="28" y="12" width="8" height="4" fill="#00e5ff"/>
  <rect x="40" y="12" width="4" height="4" fill="#00e5ff"/>
  <!-- Third row - wide body -->
  <rect x="16" y="16" width="4" height="4" fill="#00e5ff"/>
  <rect x="20" y="16" width="4" height="4" fill="#00e5ff"/>
  <rect x="24" y="16" width="4" height="4" fill="#00e5ff"/>
  <rect x="28" y="16" width="8" height="4" fill="#00e5ff"/>
  <rect x="36" y="16" width="4" height="4" fill="#00e5ff"/>
  <rect x="40" y="16" width="4" height="4" fill="#00e5ff"/>
  <rect x="44" y="16" width="4" height="4" fill="#00e5ff"/>
  <!-- Fourth row - full width -->
  <rect x="12" y="20" width="4" height="4" fill="#00e5ff"/>
  <rect x="16" y="20" width="4" height="4" fill="#00e5ff"/>
  <rect x="20" y="20" width="4" height="4" fill="#b388ff"/>
  <rect x="24" y="20" width="4" height="4" fill="#00e5ff"/>
  <rect x="28" y="20" width="8" height="4" fill="#00e5ff"/>
  <rect x="36" y="20" width="4" height="4" fill="#00e5ff"/>
  <rect x="40" y="20" width="4" height="4" fill="#b388ff"/>
  <rect x="44" y="20" width="4" height="4" fill="#00e5ff"/>
  <rect x="48" y="20" width="4" height="4" fill="#00e5ff"/>
  <!-- Fifth row - eyes row -->
  <rect x="12" y="24" width="4" height="4" fill="#00e5ff"/>
  <rect x="16" y="24" width="4" height="4" fill="#00e5ff"/>
  <rect x="20" y="24" width="4" height="4" fill="#ffffff"/>
  <rect x="24" y="24" width="4" height="4" fill="#00e5ff"/>
  <rect x="28" y="24" width="8" height="4" fill="#00e5ff"/>
  <rect x="36" y="24" width="4" height="4" fill="#00e5ff"/>
  <rect x="40" y="24" width="4" height="4" fill="#ffffff"/>
  <rect x="44" y="24" width="4" height="4" fill="#00e5ff"/>
  <rect x="48" y="24" width="4" height="4" fill="#00e5ff"/>
  <!-- Sixth row -->
  <rect x="12" y="28" width="4" height="4" fill="#00e5ff"/>
  <rect x="16" y="28" width="4" height="4" fill="#00e5ff"/>
  <rect x="20" y="28" width="4" height="4" fill="#00e5ff"/>
  <rect x="24" y="28" width="4" height="4" fill="#00e5ff"/>
  <rect x="28" y="28" width="8" height="4" fill="#00e5ff"/>
  <rect x="36" y="28" width="4" height="4" fill="#00e5ff"/>
  <rect x="40" y="28" width="4" height="4" fill="#00e5ff"/>
  <rect x="44" y="28" width="4" height="4" fill="#00e5ff"/>
  <rect x="48" y="28" width="4" height="4" fill="#00e5ff"/>
  <!-- Seventh row - narrower -->
  <rect x="16" y="32" width="4" height="4" fill="#00e5ff"/>
  <rect x="24" y="32" width="4" height="4" fill="#00e5ff"/>
  <rect x="28" y="32" width="8" height="4" fill="#00e5ff"/>
  <rect x="36" y="32" width="4" height="4" fill="#00e5ff"/>
  <rect x="44" y="32" width="4" height="4" fill="#00e5ff"/>
  <!-- Eighth row - legs -->
  <rect x="12" y="36" width="4" height="4" fill="#00e5ff"/>
  <rect x="20" y="36" width="4" height="4" fill="#00e5ff"/>
  <rect x="40" y="36" width="4" height="4" fill="#00e5ff"/>
  <rect x="48" y="36" width="4" height="4" fill="#00e5ff"/>
  <!-- Ninth row - feet -->
  <rect x="8" y="40" width="4" height="4" fill="#00e5ff"/>
  <rect x="16" y="40" width="4" height="4" fill="#00e5ff"/>
  <rect x="44" y="40" width="4" height="4" fill="#00e5ff"/>
  <rect x="52" y="40" width="4" height="4" fill="#00e5ff"/>
  <!-- Accent glow dots - green engine/energy -->
  <rect x="28" y="36" width="8" height="4" fill="#39ff14"/>
  <!-- Bottom decorative scan-line glow -->
  <rect x="16" y="48" width="32" height="2" fill="#00e5ff" opacity="0.3"/>
  <rect x="20" y="52" width="24" height="2" fill="#00e5ff" opacity="0.15"/>
</svg>
