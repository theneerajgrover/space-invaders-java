# ===========================================
# Space Invaders - Application Configuration
# ===========================================

# Server port
server.port=8080

# SQLite Database Configuration
# The database file is stored in the 'data' directory.
# Hibernate will auto-create/update the schema as needed.
spring.datasource.url=jdbc:sqlite:data/space_invaders.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA settings for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable open-in-view to avoid lazy-loading issues
spring.jpa.open-in-view=false

# SQLite connection pool settings (SQLite works best with a single connection)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
